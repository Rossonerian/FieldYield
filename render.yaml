services:
  - type: web
    name: fieldyield-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fieldyield-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fieldyield-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://field-yield.vercel.app
      - key: AUTH_PROVIDER
        value: supabase
      - key: SIGNUP_BONUS_ENABLED
        value: "true"
      - key: SIGNUP_BONUS_GOLD
        value: "100"
      - key: SIGNUP_BONUS_SILVER
        value: "0"
      - key: MARKET_ENGINE_BASE_URL
        sync: false
      - key: MARKET_ENGINE_API_KEY
        sync: false
      - key: MARKET_ENGINE_TIMEOUT_MS
        value: "3000"
      - key: MARKET_ENGINE_VERSION
        value: v1
      - key: SUPABASE_URL
        value: https://uewpyfwnuiqjzxahmesz.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false

  - type: keyvalue
    name: fieldyield-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Render services
    maxmemoryPolicy: noeviction

databases:
  - name: fieldyield-db
    plan: free
    databaseName: fieldyield
    user: fieldyield
